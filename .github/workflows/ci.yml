name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reconcile_app
          POSTGRES_PASSWORD: reconcile_dev
          # The app's own DATABASE_URL and the test suite's TEST_DATABASE_URL
          # are pointed at this same single database below -- the test suite
          # (backend/tests/conftest.py) only ever talks to TEST_DATABASE_URL
          # and never touches settings.database_url, so a second database
          # isn't needed here the way docker-compose.yml provisions one.
          POSTGRES_DB: reconcile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://reconcile_app:reconcile_dev@localhost:5432/reconcile_test
      TEST_DATABASE_URL: postgresql://reconcile_app:reconcile_dev@localhost:5432/reconcile_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The project has been developed against Python 3.8.20 (backend/
          # requires it via a local conda env). Python 3.8 went EOL in
          # October 2024, and GitHub's `ubuntu-latest` label has pointed at
          # Ubuntu 24.04 ("noble") since January 2025; actions/setup-python
          # does not have a Python 3.8 build for 24.04 (see
          # actions/setup-python#879), so pinning "3.8" here would fail on
          # this runner. 3.9 is the closest version with 24.04-compatible
          # builds (it kept receiving patch releases into late 2024/2025,
          # after Ubuntu 24.04 became generally available, so those later
          # 3.9.x builds target noble). This has not been verified against a
          # live GitHub Actions run yet -- if 3.9 also turns out to be
          # unavailable, bump this to 3.10/3.11 or pin `runs-on` to
          # `ubuntu-22.04` instead, which does carry a Python 3.8 build.
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
