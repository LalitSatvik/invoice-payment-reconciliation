name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reconcile_app
          POSTGRES_PASSWORD: reconcile_dev
          # The app's own DATABASE_URL and the test suite's TEST_DATABASE_URL
          # are pointed at this same single database below -- the test suite
          # (backend/tests/conftest.py) only ever talks to TEST_DATABASE_URL
          # and never touches settings.database_url, so a second database
          # isn't needed here the way docker-compose.yml provisions one.
          POSTGRES_DB: reconcile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://reconcile_app:reconcile_dev@localhost:5432/reconcile_test
      TEST_DATABASE_URL: postgresql://reconcile_app:reconcile_dev@localhost:5432/reconcile_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
